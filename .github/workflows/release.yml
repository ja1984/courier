name: Release

# Push a tag like v1.1.0 to publish a release with a downloadable Courier.app.
# Running it by hand (Actions › Release › Run workflow) only builds the zip as a
# workflow artifact, without publishing anything.
#
# Releases are signed with the Developer ID certificate and notarized. Tagged runs fail
# without the secrets below rather than publish an unsigned app; manual runs fall back
# to ad-hoc signing so the build itself can still be tested.
#
# Secrets (Settings › Secrets and variables › Actions):
#   DEVELOPER_ID_P12           base64 of the exported "Developer ID Application" .p12
#   DEVELOPER_ID_P12_PASSWORD  password chosen when exporting the .p12
#   NOTARY_API_KEY             base64 of the App Store Connect API key (AuthKey_XXXX.p8)
#   NOTARY_API_KEY_ID          that key's Key ID
#   NOTARY_API_ISSUER_ID       the Issuer ID shown above the keys list
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.NOTARY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Signing mode
        run: |
          if [[ "$HAS_SIGNING" == "true" ]]; then
            echo "Developer ID + notarization"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::Tagged releases must be signed and notarized. Add the secrets listed at the top of release.yml."
            exit 1
          else
            echo "::notice::No signing secrets; building an ad-hoc signed app."
          fi

      - name: Toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then echo "::error::No Developer ID Application identity in the .p12"; exit 1; fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Courier.app (universal)
        env:
          UNIVERSAL: "1"
          COURIER_VERSION: ${{ steps.version.outputs.version }}
          COURIER_BUILD: ${{ github.run_number }}
        run: |
          # Without the secrets, sign ad-hoc rather than with whatever the runner has.
          export CODESIGN_IDENTITY="${CODESIGN_IDENTITY:--}"
          ./scripts/build-app.sh
          lipo -archs build/Courier.app/Contents/MacOS/Courier
          codesign --verify --deep --strict --verbose=2 build/Courier.app

      - name: Notarize the app
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          ditto -c -k --keepParent build/Courier.app "$RUNNER_TEMP/notarize.zip"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" ./scripts/notarize.sh "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple build/Courier.app
          spctl --assess --type execute --verbose=2 build/Courier.app

      - name: Package
        id: package
        run: |
          NAME="Courier-${{ steps.version.outputs.version }}"
          ditto -c -k --keepParent build/Courier.app "$NAME.zip"
          ./scripts/make-dmg.sh "$NAME.dmg"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Notarize the disk image
        if: env.HAS_SIGNING == 'true'
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          DMG="${{ steps.package.outputs.name }}.dmg"
          ./scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Checksums
        run: |
          NAME="${{ steps.package.outputs.name }}"
          shasum -a 256 "$NAME.dmg" "$NAME.zip" | tee SHA256SUMS.txt

      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.dmg
            ${{ steps.package.outputs.name }}.zip
            SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.name }}.dmg" "${{ steps.package.outputs.name }}.zip" SHA256SUMS.txt \
            --title "Courier ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
